<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Polla Fattah - {{ page.jobTitle }} | {{ page.contacts[0].text }}</title>
  <meta name="description" content="{{ page.description }}">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="index, follow">

  <link rel="canonical" href="https://polla.dev{{ page.permalink }}">
  <link rel="icon" type="image/x-icon" href="/img/brand/icon.png">

  <!-- Open Graph -->
  <meta property="og:title" content="Polla Fattah - {{ page.jobTitle }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:image" content="https://polla.dev{{ page.ogimage }}">
  <meta property="og:url" content="https://polla.dev{{ page.permalink }}">
  <meta property="og:site_name" content="Polla.dev">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@FattahPolla">
  <meta name="twitter:title" content="Polla Fattah - {{ page.jobTitle }}">
  <meta name="twitter:description" content="{{ page.description }}">
  <meta name="twitter:image" content="https://polla.dev{{ page.ogimage }}">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
</head>

<body class="vcard-page" style="--vcard-accent: {{ page.bgcolor }}">
  <div class="vcard">
    <div class="vcard-profile">
      {% if page.picture %}
      <img src="{{ page.picture }}" alt="Polla Fattah" class="profile-pic">
      {% else %}
      <img src="/img/portraits/polla-fattah-image.jpg" alt="Polla Fattah" class="profile-pic">
      {% endif %}

      <h1>{{ page.name }}</h1>
      <h2>{{ page.jobTitle }}</h2>
      <div class="contact-buttons">
        <a href="{{ page.phone }}" class="contact-button">
          <div class="contact-button-icon"><i class="fas fa-paper-plane icon-big"></i></div>
          <div class="contact-button-label">CALL</div>
        </a>
        <a href="{{ page.email }}" class="contact-button">
          <div class="contact-button-icon"><i class="fas fa-envelope icon-big"></i></div>
          <div class="contact-button-label">EMAIL</div>
        </a>
      </div>
    </div>

    <div class="contact-info">
      {% for contact in page.contacts %}
      <a class="contact-item" href="{{ contact.url }}" target="_{{ contact.text }}">
        <i class="{{ contact.fa }} icon"></i>
        <div class="contact-details">
          <p>{{ contact.text }}</p>
          <p>{{ contact.title }}</p>
        </div>
      </a>
      {% endfor %}
    </div>

    <div class="vcard-download">
      <a class="add-contact" href="{{ page.vcffile }}"><i class="fa fa-download"></i></a>
    </div>
  </div>
</body>

</html>
