---
layout: default
---

<div class="container page-heading">
  <div class="row">
    <div class="col-lg-10 col-md-12 mx-auto">
      <h1>{{ page.title }}</h1>
      {% if page.description %}
      <span class="subheading">{{ page.description }}</span>
      {% endif %}
    </div>
  </div>
</div>

<div class="container">
  <div class="row">
    <div class="col-lg-10 col-md-12 mx-auto page-body">

      {{ content }}

    </div>
  </div>
</div>
