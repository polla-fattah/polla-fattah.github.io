---
layout: default
---

<!-- Page Header -->
<div class="container page-heading">
  <div class="row">
    <div class="col-lg-8 col-md-10 mx-auto">
      <h1>{{ page.title }}</h1>
      {% if page.description %}
      <span class="subheading">{{ page.description }}</span>
      {% endif %}
    </div>
  </div>
</div>

<div class="container">
  <div class="row">
    <div class="col-lg-8 col-md-10 mx-auto page-body page-body--flush">

      {{ content }}

    </div>
  </div>
</div>
