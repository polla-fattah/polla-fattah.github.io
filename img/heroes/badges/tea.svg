<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Tea badge — matches the homepage logo: dark circle, solid gold emblem -->
  <circle cx="50" cy="50" r="50" fill="#1c1c1e"/>
  <g fill="#c9a04e">
    <!-- Cup -->
    <path d="M28 42 h36 v10 c0 10 -8 16 -18 16 s-18 -6 -18 -16 z"/>
    <!-- Saucer -->
    <rect x="22" y="72" width="48" height="5" rx="2.5"/>
  </g>
  <!-- Handle -->
  <path d="M64 46 h4 a7 7 0 0 1 0 14 h-4" fill="none" stroke="#c9a04e" stroke-width="4.5"/>
  <!-- Steam -->
  <g fill="none" stroke="#c9a04e" stroke-width="3.5" stroke-linecap="round">
    <path d="M39 24 c-2.5 4 2.5 6.5 0 11"/>
    <path d="M53 21 c-2.5 4 2.5 6.5 0 11"/>
  </g>
</svg>
