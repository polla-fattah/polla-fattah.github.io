<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Meeting new students to learn static site generation</title>
  <desc id="desc">An editorial illustration of students collaborating around a laptop with Markdown, JSON, XML, Git, and deployment notes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172b3a"/>
      <stop offset="0.62" stop-color="#214e5a"/>
      <stop offset="1" stop-color="#d66b4c"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2b866"/>
      <stop offset="1" stop-color="#f0d28f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0b1720" flood-opacity="0.3"/>
    </filter>
