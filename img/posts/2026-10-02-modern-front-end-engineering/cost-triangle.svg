<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
  <title id="t">The Web Rendering Cost Triangle</title>
  <desc id="d">Every rendering strategy pushes cost toward one of three corners: the server and request cost, the build and deployment cost, or the client and device cost.</desc>
  <rect width="1000" height="640" rx="20" fill="#f7f4ec"/>
  <path d="M500 110 L850 480 L150 480 Z" fill="#e8e1cf" stroke="#173241" stroke-width="3" stroke-linejoin="round"/>
  <g text-anchor="middle" fill="#173241">
    <rect x="360" y="40" width="280" height="86" rx="12" fill="#173241"/>
    <text x="500" y="76" fill="#f7f4ec" font-size="20" font-weight="700">Server &amp; request cost</text>
    <text x="500" y="102" fill="#d9d2bd" font-size="15">origin CPU, database, edge compute</text>

    <rect x="40" y="470" width="280" height="86" rx="12" fill="#4e9f93"/>
    <text x="180" y="506" fill="#ffffff" font-size="20" font-weight="700">Build &amp; deployment cost</text>
    <text x="180" y="532" fill="#eaf4f1" font-size="15">CI time, cache invalidation</text>

    <rect x="680" y="470" width="280" height="86" rx="12" fill="#a87c2f"/>
    <text x="820" y="506" fill="#ffffff" font-size="20" font-weight="700">Client &amp; device cost</text>
    <text x="820" y="532" fill="#f6ecd5" font-size="15">battery, main thread, memory</text>

    <text x="500" y="250" font-size="18" font-weight="700">SSR</text>
    <text x="500" y="274" font-size="14" fill="#4a5560">pays per request</text>
    <text x="270" y="440" font-size="18" font-weight="700">SSG</text>
    <text x="270" y="420" font-size="14" fill="#4a5560">pays at build time</text>
    <text x="730" y="440" font-size="18" font-weight="700">CSR</text>
    <text x="730" y="420" font-size="14" fill="#4a5560">pays on the device</text>
    <text x="500" y="590" font-size="15" fill="#4a5560">Moving work away from one corner adds cost or constraints at another.</text>
  </g>
</svg>
