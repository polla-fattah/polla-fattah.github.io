<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
  <title id="t">The five arcs of the book</title>
  <desc id="d">Nineteen chapters grouped into five arcs: build and understand a first site, record and publish, agents and content structure, contribute check and reach readers, maintenance and original projects.</desc>
  <rect width="1000" height="420" rx="20" fill="#f7f4ec"/>
  <g text-anchor="middle" fill="#173241">
    <rect x="30" y="60" width="176" height="250" rx="12" fill="#bfe2d6"/>
    <text x="118" y="92" font-size="14" fill="#2f4f48">ARC 1 · Ch 1–5</text>
    <text x="118" y="122" font-size="17" font-weight="700">Build and understand</text>
    <text x="118" y="146" font-size="14">a first site</text>
    <text x="118" y="190" font-size="13" fill="#2f4f48">Markdown · pages</text>
    <text x="118" y="212" font-size="13" fill="#2f4f48">navigation · HTML · CSS</text>

    <rect x="216" y="60" width="176" height="250" rx="12" fill="#e8e1cf"/>
    <text x="304" y="92" font-size="14" fill="#4a5560">ARC 2 · Ch 6–7</text>
    <text x="304" y="122" font-size="17" font-weight="700">Record and publish</text>
    <text x="304" y="190" font-size="13" fill="#4a5560">Git history</text>
    <text x="304" y="212" font-size="13" fill="#4a5560">GitHub Pages</text>

    <rect x="402" y="60" width="176" height="250" rx="12" fill="#f1dfae"/>
    <text x="490" y="92" font-size="14" fill="#6b5420">ARC 3 · Ch 8–12</text>
    <text x="490" y="122" font-size="17" font-weight="700">Agents and content</text>
    <text x="490" y="146" font-size="14">structure</text>
    <text x="490" y="190" font-size="13" fill="#6b5420">bounded agent tasks</text>
    <text x="490" y="212" font-size="13" fill="#6b5420">templates · layouts · JSON</text>

    <rect x="588" y="60" width="176" height="250" rx="12" fill="#e8e1cf"/>
    <text x="676" y="92" font-size="14" fill="#4a5560">ARC 4 · Ch 13–17</text>
    <text x="676" y="122" font-size="17" font-weight="700">Contribute, check,</text>
    <text x="676" y="146" font-size="14">reach readers</text>
    <text x="676" y="190" font-size="13" fill="#4a5560">CI/CD · search</text>
    <text x="676" y="212" font-size="13" fill="#4a5560">languages · forms</text>

    <rect x="774" y="60" width="196" height="250" rx="12" fill="#bfe2d6"/>
    <text x="872" y="92" font-size="14" fill="#2f4f48">ARC 5 · Ch 18–19</text>
    <text x="872" y="122" font-size="17" font-weight="700">Maintain and build</text>
    <text x="872" y="146" font-size="14">your own project</text>
    <text x="872" y="190" font-size="13" fill="#2f4f48">migrate · recover</text>
    <text x="872" y="212" font-size="13" fill="#2f4f48">brief · deliver</text>

    <text x="500" y="352" font-size="16" font-weight="700">Every chapter: preview the result, make one working edit, break something on purpose, practise alone</text>
    <text x="500" y="380" font-size="14" fill="#4a5560">The human stays responsible for what goes live.</text>
  </g>
</svg>
